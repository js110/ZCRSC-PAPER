name: Reproducibility smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Reference-semantics tests
        run: python3 -m unittest discover -s prototype -p test_robust_depth.py -v
      - name: Receiver-calibration tests
        run: python3 -m unittest discover -s experiments -p test_receiver_calibration.py -v
      - name: Archived compilation renderer
        run: python3 figures/render_compile_sweep.py experiments/compile_sweep_20260915T010554Z --output-dir /tmp/compile-figures
      - uses: actions/setup-go@v6
        with:
          go-version-file: prototype/zkdepth/go.mod
          cache-dependency-path: prototype/zkdepth/go.sum
      - name: Go and gnark tests
        working-directory: prototype/zkdepth
        run: go test ./...
      - name: Synthetic semantic smoke run
        run: python3 experiments/run_semantic_evaluation.py --seeds 3 --events-per-seed 20 --output /tmp/semantic_smoke.json
